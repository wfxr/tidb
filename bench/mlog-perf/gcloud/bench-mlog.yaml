              function install-commons() {
                  dnf install -y --setopt=install_weak_deps=false epel-release
                  dnf install -y --setopt=install_weak_deps=false git tig lnav tmux rsync numactl mysql bash-completion
              }

              function install-sysbench() {
                  dnf -y install git make automake libtool pkgconfig libaio-devel openssl-devel
                  dnf -y install mariadb-connector-c-devel

                  git clone https://github.com/zyguan/sysbench.git /root/sysbench
                  pushd /root/sysbench
                  git checkout dev
                  ./autogen.sh
                  ./configure
                  make -j
                  make install
                  popd
              }

              function install-sysbench-official() {
                  dnf -y install sysbench
              }

              function install-jsonnet() {
                  gsutil cp gs://oltp-bench-us-east5/tools/go-jsonnet_0.20.0_Linux_x86_64.tar.gz /tmp/jsonnet.tar.gz
                  tar -xf /tmp/jsonnet.tar.gz -C /usr/local/bin
              }

              function install-yq() {
                  gsutil cp gs://oltp-bench-us-east5/tools/yq_linux_amd64.tar.gz /tmp/yq.tar.gz
                  tar -xf /tmp/yq.tar.gz -C /usr/local/bin ./yq_linux_amd64
                  mv /usr/local/bin/yq_linux_amd64 /usr/local/bin/yq
              }

              function mount-disk() {
                  local disk=${1:-$([[ $(mount | grep 'on / type') == /dev/sda* ]] && echo /dev/sdb || echo /dev/sda)}
                  local mount_point=${2:-/data}
                  mkdir -p $mount_point
                  mkfs.ext4 -m 0 -E lazy_itable_init=0,lazy_journal_init=0,discard $disk
                  echo "$(blkid -o export $disk | grep UUID) $mount_point ext4 discard,defaults,noatime,nodelalloc 0 2" | tee -a /etc/fstab
                  systemctl daemon-reload
                  mount $disk
              }

